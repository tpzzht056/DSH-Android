name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [dev]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install SDK platform 37.2 and build-tools
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "SDK_ROOT=$SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$SDK_ROOT" 2>/dev/null || true
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find / -name sdkmanager -type f 2>/dev/null | head -1)"
          fi
          echo "SDKMANAGER=$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --list 2>/dev/null | grep -E "platforms;android-3[67]" | head -20 || true
          "$SDKMANAGER" "platforms;android-37.2" "platform-tools" || \
          "$SDKMANAGER" --channel=3 "platforms;android-37.2" "platform-tools" || true
          "$SDKMANAGER" --list_installed 2>/dev/null | grep platforms || true

      - name: Fetch prebuilt native libs (libnode etc.)
        run: |
          chmod +x native/prebuilt.sh
          bash native/prebuilt.sh fetch
          find toolchains/out/jniLibs -maxdepth 1 -type f | head -5

      - name: Build engine (dsh + plugins + patches -> engine.zip)
        run: |
          mkdir -p toolchains/out
          chmod +x js/build-engine.sh
          OUT_DIR="$PWD/toolchains/out/engine" bash js/build-engine.sh
          ls -la toolchains/out/engine

      - name: Fetch Shizuku APK + third-party assets
        run: |
          chmod +x tools/fetch-shizuku.sh
          bash tools/fetch-shizuku.sh

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug \
            -Pdsh.engineOut="$PWD/toolchains/out/engine" \
            -Pdsh.thirdPartyOut="$PWD/toolchains/out/third-party" \
            --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DSH-Android-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
